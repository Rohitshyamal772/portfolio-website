<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16a085"/>
      <stop offset="1" stop-color="#1e5a4a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <g opacity="0.14" fill="#ffffff">
    <circle cx="560" cy="40" r="120"/>
    <circle cx="30" cy="330" r="90"/>
  </g>

  <rect x="40" y="30" width="170" height="52" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="60" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Appointments</text>

  <rect x="230" y="30" width="170" height="52" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="250" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Today</text>
  <text x="374" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7bf5d8">12</text>

  <rect x="420" y="30" width="180" height="52" rx="12" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="440" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Doctors</text>
  <text x="560" y="62" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#7bf5d8">8</text>

  <rect x="40" y="110" width="560" height="220" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25"/>

  <!-- medical cross badge -->
  <g transform="translate(320,200)">
    <circle r="46" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="-13" y="-30" width="26" height="60" rx="6" fill="#16a085"/>
    <rect x="-30" y="-13" width="60" height="26" rx="6" fill="#16a085"/>
  </g>

  <text x="320" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#eafff9">Appointment System</text>
  <text x="320" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#c9eee2">Patients • Records • Doctor Schedules</text>

  <!-- calendar dots -->
  <g fill="#7bf5d8" opacity="0.9">
    <rect x="70" y="125" width="26" height="26" rx="7"/>
    <rect x="104" y="125" width="26" height="26" rx="7"/>
    <rect x="138" y="125" width="26" height="26" rx="7"/>
    <text x="300" y="145" font-family="Arial, sans-serif" font-size="14" fill="#eafffb">Schedule</text>
  </g>
</svg>